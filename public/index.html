<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Focus" />
  <meta name="theme-color" content="#0b0d12" />
  <title>Focus</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="dot"></span> FOCUS</div>
    <div class="topbar-right">
      <div class="live" id="liveDot"><span class="live-dot"></span><span id="liveText">live</span></div>
      <button class="linklike" id="logoutBtn">sign out</button>
    </div>
  </header>

  <main id="main">

    <!-- ============ FOCUS VIEW ============ -->
    <section id="view-record" class="view">

      <div class="card now-card" id="nowCard">
        <div class="now-label">RIGHT NOW</div>
        <div class="now-task" id="nowTask">Waiting for the plan…</div>
        <div class="now-meta" id="nowMeta">—</div>
      </div>

      <div class="card feed-card">
        <div class="section-head">THE WARDEN</div>
        <div id="verdicts" class="verdicts">
          <div class="empty">Silent, for now.</div>
        </div>
      </div>

      <div class="card cam-card">
        <div class="cam-wrap">
          <video id="preview" playsinline muted autoplay></video>
          <div id="placeholder" class="cam-off">
            <div class="cam-off-dot"></div>
            <span>camera off</span>
          </div>
          <div id="recBadge" class="rec-badge"><span class="rec-pip"></span><span id="recText">REC</span><span id="timer">00:00:00</span></div>
        </div>
        <div class="cam-settings">
          <label>quality
            <select id="quality">
              <option value="480">480p</option>
              <option value="720" selected>720p</option>
              <option value="1080">1080p</option>
            </select>
          </label>
          <label>segment
            <select id="segLen">
              <option value="5">5 min</option>
              <option value="10" selected>10 min</option>
            </select>
          </label>
        </div>
      </div>

      <div class="card todos-card">
        <div class="section-head row">
          <span>THE PLAN</span>
          <span class="muted" id="todosUpdated"></span>
        </div>
        <ul id="todoList" class="todos"><li class="empty">No tasks yet — the agent sets them.</li></ul>
      </div>

    </section>

    <!-- ============ LIBRARY VIEW ============ -->
    <section id="view-library" class="view" style="display:none">
      <div class="card">
        <div class="section-head row"><span>SESSIONS</span><span class="muted" id="disk"></span></div>
        <div id="sessions" class="sessions"><div class="empty">Loading…</div></div>
      </div>
    </section>

  </main>

  <nav class="bottombar">
    <button class="navbtn active" id="tabFocus" data-view="record">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3.5" fill="currentColor"/></svg>
      <span>Focus</span>
    </button>
    <button id="startBtn" class="rec-btn" aria-label="start recording"><span class="rec-pip-big"></span></button>
    <button class="navbtn" id="tabLibrary" data-view="library">
      <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 5v14" stroke="currentColor" stroke-width="2"/><path d="M14 5v14" stroke="currentColor" stroke-width="2"/></svg>
      <span>Library</span>
    </button>
  </nav>

  <div id="status" class="status"></div>

  <script src="/app.js"></script>
</body>
</html>
