<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f1115" />
  <title>Focus Cam · Login</title>
  <style>
    :root { --bg:#0f1115; --panel:#181b22; --accent:#5b8cff; --text:#e7e9ee;
      --muted:#9aa0ac; --rec:#ff4d4f; --border:#2a2f3a; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--text); min-height:100vh; display:flex;
      align-items:center; justify-content:center; font-family:-apple-system,BlinkMacSystemFont,
      "Segoe UI",Roboto,Helvetica,Arial,sans-serif; padding:20px; }
    .card { background:var(--panel); border:1px solid var(--border); border-radius:18px;
      padding:34px 30px; width:100%; max-width:360px; }
    .brand { display:flex; align-items:center; gap:10px; font-weight:800; font-size:20px;
      justify-content:center; margin-bottom:6px; }
    .brand .dot { width:13px; height:13px; border-radius:50%; background:var(--accent); }
    .sub { text-align:center; color:var(--muted); font-size:13px; margin-bottom:24px; }
    label { display:block; font-size:13px; color:var(--muted); margin:16px 0 7px; font-weight:600; }
    input { width:100%; background:#20242e; color:var(--text); border:1px solid var(--border);
      border-radius:10px; padding:13px; font-size:15px; outline:none; }
    input:focus { border-color:var(--accent); }
    .remember { display:flex; align-items:center; gap:8px; margin-top:16px; color:var(--muted);
      font-size:13px; cursor:pointer; }
    .remember input { width:auto; }
    .btn { width:100%; margin-top:24px; border:none; border-radius:11px; padding:14px;
      font-size:16px; font-weight:700; cursor:pointer; color:#fff; background:var(--accent); }
    .btn:active { transform:scale(.98); }
    .err { color:var(--rec); font-size:13px; text-align:center; margin-top:14px; min-height:18px; }
  </style>
</head>
<body>
  <form class="card" id="form" autocomplete="on">
    <div class="brand"><span class="dot"></span> Focus Cam</div>
    <div class="sub">Sign in to start your session</div>
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" autofocus required />
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />
    <label class="remember"><input type="checkbox" id="remember" checked /> Stay logged in on this device</label>
    <button class="btn" type="submit">Sign in</button>
    <div class="err" id="err"></div>
  </form>
  <script>
    const form = document.getElementById("form");
    const err = document.getElementById("err");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      err.textContent = "";
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const remember = document.getElementById("remember").checked;
      try {
        const r = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password, remember }),
        });
        const data = await r.json();
        if (r.ok && data.ok) {
          window.location.href = "/";
        } else {
          err.textContent = data.error || "Login failed";
        }
      } catch (_) {
        err.textContent = "Network error";
      }
    });
  </script>
</body>
</html>
